<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 — Recent Searches</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; padding: 2rem; }
        .wrapper { max-width: 550px; margin: 0 auto; }
        h1 { color: #39ff14; font-size: 2rem; margin-bottom: 0.25rem; }
        .subtitle { color: #555; font-size: 0.85rem; margin-bottom: 0.5rem; }
        p.desc { color: #aaa; margin-bottom: 2rem; line-height: 1.7; }

        .search-wrapper { position: relative; margin-bottom: 1.5rem; }

        .search-row { display: flex; gap: 0.5rem; }

        #search-input {
            flex: 1;
            padding: 0.85rem 1rem;
            background: #16213e;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-family: Georgia, sans-serif;
            transition: border-color 0.3s;
        }
        #search-input:focus { outline: none; border-color: #39ff14; }
        #search-input::placeholder { color: #444; }

        button.search-btn {
            padding: 0.85rem 1.5rem;
            background: #39ff14;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button.search-btn:hover { background: #28b30e; }

        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 60px;
            background: #16213e;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 10;
            display: none;
        }
        .dropdown.open { display: block; }

        .dropdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: #aaa;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #1a1a2e; color: #39ff14; }

        .remove-search { color: #444; font-size: 0.8rem; transition: color 0.2s; }
        .dropdown-item:hover .remove-search { color: #e74c3c; }

        #results {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 100px;
        }

        .result-title { color: #39ff14; font-size: 0.85rem; margin-bottom: 1rem; }
        .result-item { color: #aaa; font-size: 0.9rem; padding: 0.5rem 0; border-bottom: 1px solid #222; }
        .result-item:last-child { border-bottom: none; }
        .no-results { color: #444; font-size: 0.9rem; text-align: center; padding: 1rem; }

        .recent-label { color: #555; font-size: 0.78rem; padding: 0.5rem 1rem; border-bottom: 1px solid #222; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Recent Searches</h1>
    <p class="subtitle">Day 2 — Week 7</p>
    <p class="desc">Searches are saved to localStorage (last 5). Click a recent search to run it again. Try searching for: Nairobi, Mombasa, Kisumu, Eldoret, Nakuru.</p>

    <div class="search-wrapper">
        <div class="search-row">
            <input type="text" id="search-input" placeholder="Search for a Kenyan city..." autocomplete="off">
            <button class="search-btn" onclick="doSearch()">Search</button>
        </div>
        <div class="dropdown" id="dropdown"></div>
    </div>

    <div id="results">
        <p class="no-results">Search for something to see results here.</p>
    </div>
</div>

<script>
    const HISTORY_KEY = "finah_search_history";
    const MAX_HISTORY = 5;

    const cities = {
        "nairobi": { name: "Nairobi", pop: "4.9 million", desc: "Kenya's capital and largest city. The city in the sun." },
        "mombasa": { name: "Mombasa", pop: "1.2 million", desc: "Coastal city on the Indian Ocean. Famous for Fort Jesus and the beaches." },
        "kisumu": { name: "Kisumu", pop: "610,000", desc: "Third largest city, on the shores of Lake Victoria." },
        "eldoret": { name: "Eldoret", pop: "475,000", desc: "Home of Kenya's legendary long-distance runners." },
        "nakuru": { name: "Nakuru", pop: "570,000", desc: "Known for Lake Nakuru and its famous flamingos." },
        "thika": { name: "Thika", pop: "279,000", desc: "Industrial city north of Nairobi. Home of the Blue Posts Hotel." }
    };

    function getHistory() {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    }

    function saveToHistory(query) {
        let history = getHistory();
        history = history.filter(h => h.toLowerCase() !== query.toLowerCase());
        history.unshift(query);
        history = history.slice(0, MAX_HISTORY);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function removeFromHistory(query) {
        let history = getHistory().filter(h => h !== query);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderDropdown();
    }

    function renderDropdown() {
        const history = getHistory();
        const dropdown = document.getElementById("dropdown");

        if (history.length === 0) {
            dropdown.classList.remove("open");
            return;
        }

        dropdown.innerHTML = `<div class="recent-label">🕐 Recent searches</div>`;
        history.forEach(item => {
            const div = document.createElement("div");
            div.className = "dropdown-item";
            div.innerHTML = `<span>${item}</span><span class="remove-search">✕</span>`;
            div.querySelector("span:first-child").onclick = () => {
                document.getElementById("search-input").value = item;
                dropdown.classList.remove("open");
                doSearch();
            };
            div.querySelector(".remove-search").onclick = (e) => {
                e.stopPropagation();
                removeFromHistory(item);
            };
            dropdown.appendChild(div);
        });

        dropdown.classList.add("open");
    }

    function doSearch() {
        const query = document.getElementById("search-input").value.trim();
        if (!query) return;

        saveToHistory(query);
        document.getElementById("dropdown").classList.remove("open");

        const results = document.getElementById("results");
        const city = cities[query.toLowerCase()];

        if (city) {
            results.innerHTML = `
                <p class="result-title">Results for "${query}"</p>
                <div class="result-item"><strong>${city.name}</strong></div>
                <div class="result-item">Population: ${city.pop}</div>
                <div class="result-item">${city.desc}</div>
            `;
        } else {
            results.innerHTML = `
                <p class="result-title">Results for "${query}"</p>
                <p class="no-results">No results found. Try: Nairobi, Mombasa, Kisumu, Eldoret, Nakuru</p>
            `;
        }
    }

    document.getElementById("search-input").addEventListener("focus", renderDropdown);

    document.getElementById("search-input").addEventListener("keydown", e => {
        if (e.key === "Enter") {
            document.getElementById("dropdown").classList.remove("open");
            doSearch();
        }
        if (e.key === "Escape") {
            document.getElementById("dropdown").classList.remove("open");
        }
    });

    document.addEventListener("click", e => {
        if (!e.target.closest(".search-wrapper")) {
            document.getElementById("dropdown").classList.remove("open");
        }
    });
</script>

</body>
</html>
